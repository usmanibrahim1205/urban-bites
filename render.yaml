services:
  - type: web
    name: urban-bites
    runtime: node
    plan: free
    branch: render-compatibility
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 26.13.0
      - key: NODE_ENV
        value: production
      - key: STAFF_CREDENTIAL
        generateValue: true
      - key: BROWSER_SIGNING_SECRET
        generateValue: true
